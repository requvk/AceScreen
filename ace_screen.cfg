# Подключать ПОСЛЕ ace.cfg. Все настраиваемые параметры собраны в начале файла.
# Длины, скорости и имена макросов резки/продувки берутся из [ace] в ace.cfg.
# Данные катушек хранятся в ace_vars.cfg; нагрев задаёт штатный _ACE_PRE_TOOLCHANGE.

# ==================== НАСТРОЙКИ ====================
[ace_screen]
# Ожидание ответа на запрос полного извлечения unwind_filament, секунд.
response_timeout: 5
# Максимальное время полного извлечения после штатной выгрузки, секунд.
operation_timeout: 180

[gcode_macro _ACE_UI_DRYER]
# Минимальная температура сушки, °C.
variable_min_temperature: 30
# Максимальная температура задаётся только max_dryer_temperature в [ace] файла ace.cfg.
# Шаг кнопок −/+, °C; допустимые значения отсчитываются от минимума.
variable_temperature_step: 5
# Начальная температура в диалоге, °C.
variable_default_temperature: 60
# Минимальное время сушки, минут.
variable_min_duration: 30
# Максимальное время сушки, минут.
variable_max_duration: 360
# Шаг кнопок −/+, минут; допустимые значения отсчитываются от минимума.
variable_duration_step: 30
# Начальное время в диалоге, минут.
variable_default_duration: 180
# Время ожидания подтверждения запуска/остановки сушилки, секунд.
variable_confirmation_timeout: 15
gcode:
    G4 P0

[gcode_macro _ACE_UI_STATE]
# Длина полного извлечения катушки из ACE Pro, целое число мм.
# Отправляется одним запросом unwind_filament; скорость берётся из [ace] retract_speed.
variable_eject_length: 1350
# Интервал проверки появления филамента в гейтах, секунд.
variable_scan_interval: 2
gcode:
    G4 P0

[gcode_macro _ACE_UI_MATERIALS]
# Температуры профилей пластика, °C: сохраняются в ace_gate_temp при выборе типа.
# Нагрев при смене катушки выполняет _ACE_PRE_TOOLCHANGE из ace.cfg.
variable_temperatures: {'PLA': 220, 'PETG': 240, 'ABS': 250, 'TPU': 220, 'ASA': 250, 'PA': 260, 'PC': 270, 'PVA': 200}
gcode:
    G4 P0

[gcode_macro _ACE_UI_COLORS]
# Палитра из 16 цветов: ключ — RGB из шести символов в верхнем регистре.
# Значение — русское название цвета на дисплее.
variable_colors: {'FFFFFF': 'Белый', '000000': 'Чёрный', '808080': 'Серый', 'C0C0C0': 'Серебристый', 'FF0000': 'Красный', '800000': 'Бордовый', 'FF8000': 'Оранжевый', 'FFFF00': 'Жёлтый', '00FF00': 'Лайм', '008000': 'Зелёный', '00FFFF': 'Бирюзовый', '0000FF': 'Синий', '000080': 'Тёмно-синий', '800080': 'Фиолетовый', 'FF00FF': 'Розовый', '8B4513': 'Коричневый'}
gcode:
    G4 P0

[delayed_gcode _ACE_UI_SCAN_INSERTIONS]
# Задержка первой проверки гейтов после запуска Klipper, секунд.
initial_duration: 5
gcode:
    _ACE_UI_SCAN_INSERTIONS

# ==================== КОМАНДЫ И СЛУЖЕБНОЕ СОСТОЯНИЕ ====================
# Числа 0/1, индексы 0..3 и −1 ниже обозначают состояния и каналы устройства.

[gcode_macro TR]
gcode:
    ACE_UI_UNLOAD

[gcode_macro _ACE_UI_INSERTIONS]
variable_previous: [-1, -1, -1, -1]
variable_queue: []
variable_tokens: [0, 0, 0, 0]
variable_notified_gate: -1
variable_notified_token: -1
gcode:
    G4 P0

[gcode_macro _ACE_UI_SCAN_INSERTIONS]
gcode:
    {% set events = printer['gcode_macro _ACE_UI_INSERTIONS'] %}
    {% set current = printer.ace.gate_status %}
    {% set scan = namespace(previous=[], queue=[], tokens=[]) %}
    {% for gate in range(4) %}
        {% set status = current[gate]|int %}
        {% set inserted = events.previous[gate]|int == 0 and status == 1 %}
        {% set token = events.tokens[gate]|int + (1 if inserted else 0) %}
        {% set scan.previous = scan.previous + [status] %}
        {% set scan.tokens = scan.tokens + [token] %}
        {% if status == 1 and (gate in events.queue or inserted) %}
            {% set scan.queue = scan.queue + [gate] %}
        {% endif %}
    {% endfor %}
    # Сохраняем порядок событий в очереди, новые вставки добавляем в конец.
    {% set ordered = namespace(queue=[]) %}
    {% for gate in events.queue %}
        {% if gate in scan.queue %}{% set ordered.queue = ordered.queue + [gate] %}{% endif %}
    {% endfor %}
    {% for gate in scan.queue %}
        {% if gate not in ordered.queue %}{% set ordered.queue = ordered.queue + [gate] %}{% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=previous VALUE="{scan.previous}"
    SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=tokens VALUE="{scan.tokens}"
    SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=queue VALUE="{ordered.queue}"
    _ACE_UI_NOTIFY_INSERTION
    UPDATE_DELAYED_GCODE ID=_ACE_UI_SCAN_INSERTIONS DURATION={printer['gcode_macro _ACE_UI_STATE'].scan_interval|float}

[gcode_macro _ACE_UI_NOTIFY_INSERTION]
# Выполняется после изменения переменных, чтобы видеть обновлённую очередь.
gcode:
    {% set events = printer['gcode_macro _ACE_UI_INSERTIONS'] %}
    {% if not events.queue or printer.ace_screen.busy or printer.print_stats.state in ['printing', 'paused'] %}
        SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=notified_gate VALUE=-1
        SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=notified_token VALUE=-1
    {% else %}
        {% set gate = events.queue[0]|int %}
        {% set token = events.tokens[gate]|int %}
        {% if events.notified_gate|int != gate or events.notified_token|int != token %}
            SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=notified_gate VALUE={gate}
            SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=notified_token VALUE={token}
            RESPOND TYPE=command MSG="action:ks_show acepro"
        {% endif %}
    {% endif %}

[gcode_macro ACE_UI_ACK_INSERTION]
description: Dismiss only the matching spool insertion event
gcode:
    {% set gate = params.GATE|int %}
    {% set token = params.TOKEN|int %}
    {% set events = printer['gcode_macro _ACE_UI_INSERTIONS'] %}
    {% if gate in range(4) and events.tokens[gate]|int == token %}
        {% set remaining = namespace(queue=[]) %}
        {% for item in events.queue %}
            {% if item != gate %}{% set remaining.queue = remaining.queue + [item] %}{% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=queue VALUE="{remaining.queue}"
        SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=notified_gate VALUE=-1
        SET_GCODE_VARIABLE MACRO=_ACE_UI_INSERTIONS VARIABLE=notified_token VALUE=-1
        _ACE_UI_NOTIFY_INSERTION
    {% endif %}

[gcode_macro ACE_UI_SET_FILAMENT]
description: Validate and save spool material, color and preset temperature
gcode:
    _ACE_SCREEN_SET_FILAMENT GATE={params.GATE} TOKEN={params.TOKEN} MATERIAL={params.MATERIAL} COLOR={params.COLOR} MANUAL={params.MANUAL|default(0)|int}

[gcode_macro ACE_UI_GATE]
description: Choose load, full eject or cancel for an ACE spool
gcode:
    {% set gate = params.GATE|default(-1)|int %}
    {% if gate not in range(4) %}
        {action_raise_error('ACE: GATE must be 0..3')}
    {% elif printer.ace_screen.busy %}
        {action_raise_error('ACE: operation is still running')}
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('ACE: filament operations require an idle printer')}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin ACE Pro - катушка {gate + 1}"
    RESPOND TYPE=command MSG="action:prompt_text Загрузить в хотэнд или полностью извлечь катушку из ACE Pro?"
    RESPOND TYPE=command MSG="action:prompt_button Извлечь|ACE_UI_EJECT GATE={gate}|warning"
    RESPOND TYPE=command MSG="action:prompt_button Загрузить|ACE_UI_LOAD GATE={gate}|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Отмена|_ACE_UI_CLOSE_PROMPT|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _ACE_UI_CLOSE_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro ACE_UI_LOAD]
description: Load via the native ACE_CHANGE_TOOL workflow
gcode:
    _ACE_UI_CLOSE_PROMPT
    _ACE_SCREEN_RUN ACTION=LOAD GATE={params.GATE}

[gcode_macro ACE_UI_EJECT]
description: Unload via ACE_CHANGE_TOOL and fully eject via one unwind_filament request
gcode:
    _ACE_UI_CLOSE_PROMPT
    _ACE_SCREEN_RUN ACTION=EJECT GATE={params.GATE}

[gcode_macro ACE_UI_UNLOAD]
description: Unload active filament via ACE_CHANGE_TOOL GATE=-1
gcode:
    _ACE_UI_CLOSE_PROMPT
    _ACE_SCREEN_RUN ACTION=UNLOAD

[gcode_macro ACE_UI_RESET]
description: Clear the last error message manually (optional)
gcode:
    _ACE_SCREEN_RESET
